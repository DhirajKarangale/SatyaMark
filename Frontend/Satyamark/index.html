<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SatyaMark" />
    <meta name="google-site-verification" content="-OHxeBbykEZKu5FRuavg_5v47L_aC4HtycQVaRnhdXc" />
    <link rel="canonical" href="https://satyamark.js.org/" />
    
    <!-- Preload critical assets for LCP -->
    <link rel="preload" as="image" href="/og-image.png" />
    
    <!-- Primary Meta Tags -->
    <title>SatyaMark | Real-Time Content Verification</title>
    <meta name="title" content="SatyaMark | Real-Time Content Verification" />
    <meta name="application-name" content="SatyaMark" />
    <meta name="description" content="SatyaMark is a centralized platform that helps users verify digital content, distinguish truth from misinformation, and view transparent verification results." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="keywords" content="SatyaMark, AI content verification, fact checking engine, deepfake detection, open source trust infrastructure, misinformation detection, react verification SDK, AI credibility platform, real-time content analysis, trust signals" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SatyaMark" />
    <meta property="og:url" content="https://satyamark.js.org/" />
    <meta property="og:title" content="SatyaMark | Real-Time Content Verification" />
    <meta property="og:description" content="A centralized platform that helps users verify digital content and distinguish truth from misinformation." />
    <meta property="og:image" content="https://satyamark.js.org/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://satyamark.js.org/" />
    <meta property="twitter:title" content="SatyaMark | Real-Time Content Verification" />
    <meta property="twitter:description" content="A centralized platform that helps users verify digital content and distinguish truth from misinformation." />
    <meta property="twitter:image" content="https://satyamark.js.org/twitter-card.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SatyaMark",
        "alternateName": ["Satya Mark", "SatyaMark AI"],
        "url": "https://satyamark.js.org/" 
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SatyaMark",
        "url": "https://satyamark.js.org/",
        "logo": "https://satyamark.js.org/favicon-32x32.png",
        "sameAs": [
          "https://github.com/DhirajKarangale/SatyaMark",
          "https://www.npmjs.com/package/satyamark-react"
        ]
      }
    ]
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: black;">
    <div id="root">
      <style>
        .initial-loader-container {
          display: flex;
          height: 100vh;
          width: 100vw;
          align-items: center;
          justify-content: center;
          background-color: #020617; /* slate-950 */
          color: #22d3ee; /* cyan-400 */
        }
        .initial-loader {
          height: 2rem;
          width: 2rem;
          animation: spin 1s linear infinite;
          border-radius: 9999px;
          border: 4px solid rgba(34, 211, 238, 0.3);
          border-top-color: #22d3ee;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
